function vCategorias() {
  const r = estado.his, nF = DIMS.fornecedor.length, ordC = ranking(r.cat);
  const nForn = Float64Array.from(DIMS.categoria, (_, c) => { let n = 0; for (let f = 0; f < nF; f++) if (r.catForn[c * nF + f] > 0) n++; return n; });
  const frag = ranking(nForn, 15);
  const unicos = [];
  for (let s = 0; s < r.sub3.length; s++) if (r.sub3F[s] >= 0 && r.sub3[s] >= MIN_UNICO) unicos.push(s);
  unicos.sort((a, b) => r.sub3[b] - r.sub3[a]);
  fila.push(() => barrasH("g-cats", ordC.slice(0, 15).map(c => ({ nome: DIMS.categoria[c], valor: r.cat[c], rotulo: shareRot(r.cat[c], r.T) }))));
  fila.push(() => barrasH("g-subs", ranking(r.sub1, 15).map(s => ({ nome: rotulo("sub1", s), valor: r.sub1[s], rotulo: shareRot(r.sub1[s], r.T) }))));
  fila.push(() => barrasH("g-frag", frag.map(c => ({ nome: DIMS.categoria[c], valor: nForn[c], extra: [{ rotulo: "Spend", valor: brl(r.cat[c]) }] })), { qtd: "nº de fornecedores", rotulo: "Fornecedores" }));
  return secao("Categorias", `Onde está o dinheiro e quão fragmentada é cada categoria · ${ctx()}`) +
    `<div class="kpis">` +
    kpi({ rotulo: "Categorias com gasto", valor: nf0.format(ordC.length), sub: ctx() }) +
    kpi({ rotulo: "Maior categoria", tom: "destaque", valor: ordC.length ? pct(r.cat[ordC[0]] / r.T, 0) : "-", sub: ordC.length ? esc(DIMS.categoria[ordC[0]]) : "" }) +
    kpi({ rotulo: "Mais fragmentada", valor: frag.length ? `${nf0.format(nForn[frag[0]])} fornecedores` : "-", sub: frag.length ? esc(DIMS.categoria[frag[0]]) : "" }) +
    kpi({ rotulo: "Subcategorias com fornecedor único", valor: nf0.format(unicos.length), sub: `${brl(unicos.reduce((s, i) => s + r.sub3[i], 0))} acima de ${brl(MIN_UNICO)} cada` }) +
    `</div><div class="grade">` +
    cartao({ id: "g-cats", altura: "alto", titulo: "Spend por categoria", desc: "Top 15 · valores em R$ e % do spend" }) +
    cartao({ id: "g-subs", altura: "alto", titulo: "Spend por subcategoria (nível 1)", desc: "Top 15 · valores em R$ e % do spend" }) +
    cartao({ id: "g-frag", altura: "alto", titulo: "Fragmentação de fornecedores", desc: "Categorias com mais fornecedores: candidatas a consolidação" }) +
    cartao({ titulo: "Subcategorias de fornecedor único", desc: `Subcategoria 3 com um só fornecedor e gasto acima de ${brl(MIN_UNICO)}`,
      corpo: tabela([{ t: "Subcategoria" }, { t: "Fornecedor único" }, { t: "Spend", cls: "num" }], unicos.slice(0, 30).map(s => `<tr><td class="forte">${esc(rotulo("sub3", s))}</td><td>${esc(DIMS.fornecedor[r.sub3F[s]])}</td><td class="num forte">${brl(r.sub3[s])}</td></tr>`), "Nenhuma subcategoria relevante com fornecedor único") }) +
    `</div>`;
}

function vPareto() {
  const r = estado.his, nF = DIMS.fornecedor.length, ord = ranking(r.forn);
  const p80 = paraN(r.forn, 0.8), p50 = paraN(r.forn, 0.5);
  const top3 = ord.slice(0, 3).reduce((s, f) => s + r.forn[f], 0);
  let acc = 0;
  const top20 = ord.slice(0, 20).map(f => { acc += r.forn[f]; return { nome: DIMS.fornecedor[f], valor: r.forn[f], rotulo: `${brl(r.forn[f])} · acum. ${pct(acc / r.T, 0)}` }; });
  const linhasCat = ranking(r.cat).map(c => {
    const fatia = r.catForn.subarray(c * nF, (c + 1) * nF);
    const o = ranking(fatia), q = paraN(fatia, 0.8);
    return `<tr><td class="forte">${esc(DIMS.categoria[c])}</td><td class="num forte">${brl(r.cat[c])}</td><td class="num">${nf0.format(o.length)}</td><td>${o.length ? esc(DIMS.fornecedor[o[0]]) : "-"}</td><td class="num">${o.length ? pct(fatia[o[0]] / r.cat[c], 0) : "-"}</td><td class="num">${nf0.format(q.n)}</td></tr>`;
  });
  fila.push(() => barrasH("g-p20", top20, { larguraRotulo: 220 }));
  return secao("Pareto & Concentração", `Quantos fornecedores concentram o spend, no total e em cada categoria · ${ctx()}`) +
    `<div class="kpis">` +
    kpi({ rotulo: "Concentram 80% do spend", tom: "destaque", valor: `${nf0.format(p80.n)} fornecedores`, sub: `${pct(p80.base ? p80.n / p80.base : NaN, 0)} dos ${nf0.format(p80.base)} fornecedores` }) +
    kpi({ rotulo: "Concentram 50% do spend", valor: `${nf0.format(p50.n)} fornecedores`, sub: `${pct(p50.base ? p50.n / p50.base : NaN, 1)} dos fornecedores` }) +
    kpi({ rotulo: "Top 3 fornecedores", valor: pct(r.T ? top3 / r.T : NaN, 0), sub: "do spend no período" }) +
    `</div><div class="grade">` +
    cartao({ largo: true, id: "g-p20", altura: "alto", titulo: "Top 20 fornecedores e participação acumulada", desc: "Rótulo mostra o spend e o % acumulado até aquele fornecedor · valores em R$" }) +
    cartao({ largo: true, titulo: "Concentração por categoria", desc: "Quantos fornecedores cada categoria tem e quantos concentram 80% dela",
      corpo: tabela([{ t: "Categoria" }, { t: "Spend", cls: "num" }, { t: "Fornecedores", cls: "num" }, { t: "Maior fornecedor" }, { t: "Share do maior", cls: "num" }, { t: "Fornecedores para 80%", cls: "num" }], linhasCat) }) +
    `</div>`;
}

function vContrato() {
  const r = estado.his, M = META.metas;
  const cob = r.base ? r.st[ST.COM] / r.base : NaN, fdp = r.base ? r.st[ST.FDP] / r.base : NaN;
  const cts = r.contratos.filter(c => c.dias >= 0 && c.dias <= META.janela_vencimento_dias).sort((a, b) => b.spend_12m - a.spend_12m);
  const risco = cts.reduce((s, c) => s + c.spend_12m, 0);
  const ini = Math.max(0, U - 23);
  const rot = MESES.slice(ini).map(rotMes);
  const traj = MESES.slice(ini).map((_, k) => r.mesBase[ini + k] ? r.mesFdp[ini + k] / r.mesBase[ini + k] : 0);
  const fdpF = ranking(r.fornFdp), c80 = paraN(r.fornFdp, 0.8);
  const semCtr = ranking(Float64Array.from(DIMS.fornecedor, (_, f) => r.forn[f] - r.fornSt[f * 5 + ST.COM]));
  fila.push(() => barra100("g-sit2", DIMS.status.map((s, i) => ({ nome: s, valor: r.st[i], cor: C.status[i], claro: i === ST.BAIXO || i === ST.PARC })), r.base));
  fila.push(() => linhaPct("g-traj", rot, traj, M.fora_politica_max));
  fila.push(() => barrasH("g-fdpcat", ranking(r.catFdp, 10).map(c => ({ nome: DIMS.categoria[c], valor: r.catFdp[c], rotulo: brl(r.catFdp[c]) })), { cor: C.fdp, rotulo: "Fora da Política" }));
  fila.push(() => barrasH("g-fdpdir", ranking(r.dirFdp, 10).map(d => ({ nome: DIMS.diretoria[d], valor: r.dirFdp[d], rotulo: brl(r.dirFdp[d]) })), { cor: C.fdp, rotulo: "Fora da Política" }));
  return secao("Com / Sem Contrato", `Cobertura contratual e classificação do gasto sem contrato. <b>Fora da Política</b> identifica compras fora das regras definidas · ${ctx()}`) +
    `<div class="kpis">` +
    kpi(Object.assign({ rotulo: "Cobertura contratual", valor: pct(cob), sub: `${baseTxt()} · meta ≥ ${pct(M.cobertura_min, 0)}` }, meta(cob, M.cobertura_min, true))) +
    kpi(Object.assign({ rotulo: "Fora da Política", valor: pct(fdp), sub: `${brl(r.st[ST.FDP])} · meta ≤ ${pct(M.fora_politica_max, 0)}` }, meta(fdp, M.fora_politica_max, false))) +
    kpi({ rotulo: `Contratos vencendo em ${META.janela_vencimento_dias} dias`, valor: brl(risco), sub: `${cts.length} contratos · ${cts.filter(c => c.dias <= 90).length} em até 90 dias` }) +
    kpi({ rotulo: "Concentração do Fora da Política", tom: "destaque", valor: `${nf0.format(c80.n)} fornecedores`, sub: `concentram 80% · ${nf0.format(c80.base)} fornecedores com Fora da Política` }) +
    `</div><div class="grade">` +
    cartao({ id: "g-sit2", altura: "baixo", titulo: "Situação contratual do spend", desc: `${baseTxt()} · Baixo valor e Parcerias são permitidos sem contrato` }) +
    cartao({ id: "g-traj", titulo: "Trajetória de Fora da Política", desc: "% do spend por mês, últimos 24 meses · linha tracejada = meta" }) +
    cartao({ id: "g-fdpcat", altura: "alto", titulo: "Fora da Política por categoria", desc: "Top 10 · valores em R$" }) +
    cartao({ id: "g-fdpdir", altura: "alto", titulo: "Fora da Política por área (diretoria)", desc: "Top 10 · valores em R$" }) +
    cartao({ largo: true, titulo: "Fornecedores que recebem sem contrato", desc: "Ordenado pelo valor Fora da Política",
      corpo: tabela([{ t: "Fornecedor" }, { t: "Fora da Política", cls: "num" }, { t: "Baixo valor + Parcerias", cls: "num" }, { t: "% sem contrato", cls: "num" }, { t: "KYS", cls: "cen" }],
        fdpF.concat(semCtr.filter(f => !r.fornFdp[f])).slice(0, 30).map(f => `<tr><td class="forte">${esc(DIMS.fornecedor[f])}</td><td class="num forte">${r.fornFdp[f] ? brl(r.fornFdp[f]) : "-"}</td><td class="num">${brl(r.fornSt[f * 5 + ST.BAIXO] + r.fornSt[f * 5 + ST.PARC])}</td><td class="num">${pct((r.forn[f] - r.fornSt[f * 5 + ST.COM]) / r.forn[f], 0)}</td><td class="cen">${seloKys(f)}</td></tr>`)) }) +
    cartao({ largo: true, titulo: "Alertas de vencimento contratual", desc: `Contratos vencendo em até ${META.janela_vencimento_dias} dias, contados a partir de hoje · valor = spend dos últimos 12 meses`,
      corpo: tabela([{ t: "Contrato" }, { t: "Descrição" }, { t: "Fornecedor" }, { t: "Vence em", cls: "cen" }, { t: "Vencimento", cls: "num" }, { t: "Spend 12 meses", cls: "num" }],
        cts.map(c => `<tr><td class="forte">${esc(c.id)}</td><td>${esc(c.descricao)}</td><td>${esc(DIMS.fornecedor[c.fornecedor])}</td><td class="cen"><span class="selo" data-nivel="${nivelDias(c.dias)}">${c.dias} d</span></td><td class="num">${dataBR(c.data_fim)}</td><td class="num forte">${brl(c.spend_12m)}</td></tr>`), "Nenhum contrato vence no período") }) +
    `</div>`;
}

function vContratos() {
  const cu = contratoUnico();
  if (cu !== null) {
    aposRender.push(() => document.getElementById("voltar-contratos").addEventListener("click", () => { estado.sel.contrato = null; atualizarTudo(); }));
    return `<div class="barra-ferr"><button type="button" class="btn" id="voltar-contratos">← Todos os contratos</button><span class="nota">Filtro Contrato: ${esc(DIMS.contrato[cu])}</span></div>` + fichaContrato(cu);
  }
  const r = estado.his, M = META.metas;
  const vet = Float64Array.from(r.ctr, (v, i) => i === 0 ? 0 : v);
  const ord = ranking(vet), tot = soma(vet), p80 = paraN(vet, 0.8);
  const baixos = ord.filter(i => { const t = totalCtr(i), sd = saldoCtr(i); return t && sd / t < M.saldo_alerta; });
  const est = ord.reduce((s, i) => s + (CTR.esteira[i] === 1 ? vet[i] : 0), 0);
  aposRender.push(() => {
    ligarBusca("busca-ctr");
    document.querySelectorAll("#vista tr.clicavel").forEach(tr => {
      const abrir = () => { estado.sel.contrato = new Set([+tr.dataset.item]); atualizarTudo(); window.scrollTo({ top: 0 }); };
      tr.addEventListener("click", abrir);
      tr.addEventListener("keydown", e => { if (e.key === "Enter") abrir(); });
    });
  });
  return secao("Contratos", `Consumo, saldo e vencimento de cada contrato. Clique em um contrato ou use o filtro Contrato para ver a ficha · ${ctx()}`) +
    `<div class="kpis">` +
    kpi({ rotulo: "Spend com contrato no período", valor: brl(tot), sub: `${pct(r.T ? tot / r.T : NaN, 0)} do spend total` }) +
    kpi({ rotulo: "Contratos com pagamento", valor: nf0.format(ord.length), sub: `${nf0.format(p80.n)} concentram 80% do spend com contrato` }) +
    kpi({ rotulo: `Saldo abaixo de ${pct(M.saldo_alerta, 0)}`, tom: baixos.length ? "alerta" : "", valor: nf0.format(baixos.length), sub: "contratos com saldo baixo ou já estourado" }) +
    kpi({ rotulo: "Via esteira expressa", tom: "destaque", valor: pct(tot ? est / tot : NaN, 0), sub: `${brl(est)} do spend com contrato` }) +
    `</div>` +
    cartao({ largo: true, titulo: "Contratos por spend no período", desc: "% consumido e saldo consideram valor contratado + aportes e todos os pagamentos na base · vermelho = saldo abaixo de 10% ou estourado",
      corpo: busca("busca-ctr", "Buscar contrato, descrição ou fornecedor...", `${ord.length} contratos com pagamento no período`) +
        tabela([{ t: "#", cls: "num" }, { t: "Contrato" }, { t: "Fornecedor" }, { t: "Spend", cls: "num" }, { t: "% consumido", cls: "num" }, { t: "Saldo", cls: "num" }, { t: "Vence em", cls: "cen" }, { t: "Esteira", cls: "cen" }, { t: "", cls: "cen" }],
          ord.slice(0, 500).map((i, k) => {
            const t = totalCtr(i), sd = saldoCtr(i), pc = t ? CTR.consumido[i] / t : NaN, forn = DIMS.fornecedor[CTR.fornecedor[i]];
            return `<tr class="clicavel" tabindex="0" data-item="${i}" data-nome="${esc((DIMS.contrato[i] + " " + CTR.descricao[i] + " " + forn).toLowerCase())}"><td class="num">${k + 1}</td>` +
              `<td class="forte">${esc(DIMS.contrato[i])}<br><small style="font-weight:400;color:var(--cor-texto-3)">${esc(CTR.descricao[i])}</small></td><td>${esc(forn)}</td><td class="num forte">${brl(vet[i])}</td>` +
              `<td class="num">${isFinite(pc) ? (pc > 1 - M.saldo_alerta ? `<span class="selo" data-nivel="critico">${pct(pc, 0)}</span>` : pct(pc, 0)) : "-"}</td>` +
              `<td class="num">${sd === null ? "-" : sd < 0 ? `<span class="selo" data-nivel="critico">${brl(sd)}</span>` : brl(sd)}</td><td class="cen">${seloVence(i)}</td>` +
              `<td class="cen">${CTR.esteira[i] === 1 ? `<span class="selo" data-nivel="ok">Sim</span>` : CTR.esteira[i] === 0 ? "Não" : "-"}</td><td class="cen seta-abrir">›</td></tr>`;
          })) });
}

function vRiscos() {
  const r = estado.his, M = META.metas, fs_ = ranking(r.forn);
  const aprov = fs_.filter(f => FORN.kys[f] === KYS_OK).length;
  const pk = fs_.length ? aprov / fs_.length : NaN;
  const neg = fs_.filter(f => FORN.kys[f] === KYS_NEG), vNeg = neg.reduce((s, f) => s + r.forn[f], 0);
  const altos = fs_.filter(f => FORN.risco[f] === RISCO_ALTO);
  const sev = f => (FORN.kys[f] === KYS_NEG ? 4 : 0) + (FORN.risco[f] === RISCO_ALTO ? 2 : 0) + (FORN.kys[f] !== KYS_OK && FORN.kys[f] !== KYS_NEG ? 1 : 0) + (FORN.risco[f] === 1 ? 0.5 : 0);
  const comRisco = fs_.filter(f => sev(f) > 0).sort((a, b) => sev(b) - sev(a) || r.forn[b] - r.forn[a]);
  const coresKys = [C.bom, C.critico, C.atencao, C.cinza];
  const snap = META.data_snapshot_fornecedores ? `posição de ${dataBR(META.data_snapshot_fornecedores)}` : "posição atual";
  fila.push(() => gauge("g-gauge", pk, M.kys_min));
  fila.push(() => rosca("g-rosca", DIMS.kys.map((k, i) => ({ nome: k, valor: r.kysV[i], cor: coresKys[i] })), r.T, [pct(r.T ? r.kysV[KYS_OK] / r.T : NaN, 1), "do spend aprovado"]));
  aposRender.push(() => ligarBusca("busca-risco"));
  return secao("Riscos", `KYS e risco financeiro dos fornecedores que recebem pagamento · ${esc(snap)} · ${ctx()}`) +
    `<div class="kpis">` +
    kpi(Object.assign({ rotulo: "Fornecedores com KYS aprovado", valor: pct(pk), sub: `${aprov} de ${fs_.length} fornecedores · meta ≥ ${pct(M.kys_min, 0)}` }, meta(pk, M.kys_min, true))) +
    kpi({ rotulo: "Pago a fornecedores com KYS negado", tom: vNeg ? "alerta" : "", valor: brl(vNeg), sub: `${neg.length} fornecedor${neg.length === 1 ? "" : "es"}` }) +
    kpi({ rotulo: "Fornecedores com risco financeiro alto", tom: "destaque", valor: nf0.format(altos.length), sub: `${brl(r.riscoV[RISCO_ALTO])} no período` }) +
    `</div><div class="grade">` +
    cartao({ id: "g-gauge", titulo: "Fornecedores com KYS aprovado", desc: "% dos fornecedores com pagamento no período · vermelho abaixo de 85%, amarelo até a meta" }) +
    cartao({ id: "g-rosca", titulo: "Spend por situação de KYS", desc: "Quanto do dinheiro vai para fornecedores aprovados e negados · valores em R$" }) +
    cartao({ largo: true, titulo: `Fornecedores com risco · ${esc(recorteCategoria())}`, desc: "KYS diferente de aprovado ou risco financeiro médio ou alto · ordenado por gravidade e spend",
      corpo: busca("busca-risco", "Buscar fornecedor...", `${comRisco.length} fornecedores com risco`) +
        tabela([{ t: "Fornecedor" }, { t: "Categoria principal" }, { t: "KYS", cls: "cen" }, { t: "Risco financeiro", cls: "cen" }, { t: "Spend", cls: "num" }, { t: "% com contrato", cls: "num" }],
          comRisco.slice(0, 300).map(f => `<tr data-nome="${esc(DIMS.fornecedor[f].toLowerCase())}"><td class="forte">${esc(DIMS.fornecedor[f])}</td><td>${esc(catPrincipal(r, f))}</td><td class="cen">${seloKys(f)}</td><td class="cen">${seloRisco(f)}</td><td class="num forte">${brl(r.forn[f])}</td><td class="num">${pct(r.fornSt[f * 5 + ST.COM] / r.forn[f], 0)}</td></tr>`),
          "Nenhum fornecedor com risco no recorte") }) +
    `</div>`;
}

function vInsights() {
  const todos = sinais();
  const lista = filtroSinal === "todos" ? todos : todos.filter(s => s.tipo === filtroSinal);
  const tot = todos.reduce((s, x) => s + x.valor, 0);
  aposRender.push(() => document.getElementById("chips-sinal").addEventListener("click", e => { const t = e.target.dataset.tipo; if (!t) return; filtroSinal = t; render(); }));
  return secao("Insights", `Sinais gerados automaticamente a partir dos dados, em ordem de valor em jogo · ${ctx()}`) +
    `<div class="kpis">` +
    kpi({ rotulo: "Sinais no recorte", valor: nf0.format(todos.length), sub: `${brl(tot)} em jogo (valores podem se sobrepor)` }) +
    Object.keys(TIPOS_SINAL).slice(0, 3).map(t => kpi({ rotulo: TIPOS_SINAL[t].nome, valor: nf0.format(todos.filter(s => s.tipo === t).length), sub: brl(todos.filter(s => s.tipo === t).reduce((a, s) => a + s.valor, 0)) })).join("") +
    `</div>` +
    `<div class="chips" id="chips-sinal"><button type="button" class="chip" data-tipo="todos" aria-pressed="${filtroSinal === "todos"}">Todos (${todos.length})</button>` +
    Object.keys(TIPOS_SINAL).map(t => `<button type="button" class="chip" data-tipo="${t}" aria-pressed="${filtroSinal === t}">${TIPOS_SINAL[t].nome} (${todos.filter(s => s.tipo === t).length})</button>`).join("") + `</div>` +
    (lista.length ? `<div class="insights">${lista.slice(0, 40).map(s => `<div class="insight" style="border-left:4px solid ${TIPOS_SINAL[s.tipo].cor}"><span class="sinal-icone" style="background:${TIPOS_SINAL[s.tipo].cor}">${TIPOS_SINAL[s.tipo].ic}</span><div class="sinal-texto">${esc(s.texto)}<small>${esc(TIPOS_SINAL[s.tipo].nome)} · ${esc(s.det)}</small></div><div class="sinal-valor">${brl(s.valor)}</div></div>`).join("")}</div>`
      : `<div class="cartao"><div class="vazio">Nenhum sinal deste tipo no recorte</div></div>`);
}

const GLOSSARIO = [
  ["Spend", "Soma dos pagamentos (valor bruto nominal) no período, pela data de pagamento"],
  ["Período", "Últimos 12 meses (padrão), YTD do ano vigente ou ano fechado. Sempre comparado ao período anterior de mesmo tamanho"],
  ["Variação", "Spend do período ÷ spend do período anterior - 1"],
  ["Fornecedor", "Agrupado pela raiz do CNPJ (8 primeiros dígitos), com o nome da matriz"],
  ["Share", "Participação de um item no spend do recorte"],
  ["Concentração 80%", "Menor número de fornecedores cuja soma atinge 80% do spend"],
  ["Fornecedor único", "Subcategoria 3 com um só fornecedor no período e gasto acima de R$ 50 mil"],
  ["Com contrato", "Pagamento com número de contrato"],
  ["Baixo valor", "Pagamento sem contrato permitido pela política por ser de baixo valor"],
  ["Parcerias", "Pagamento sem contrato permitido pela política por ser de parceria"],
  ["Fora da Política", "Pagamento sem contrato que deveria ter contrato"],
  ["Não classificado", "Pagamento sem contrato e sem classificação na base (qualidade de dado)"],
  ["Cobertura contratual", "Spend com contrato ÷ spend total"],
  ["Contratos vencendo", "Contratos com vencimento nos próximos 180 dias, contados a partir de hoje; valor = spend dos últimos 12 meses no contrato"],
  ["Aporte", "Aditivo que aumenta o valor do contrato"],
  ["Saldo do contrato", "Valor contratado + aportes - pagamentos na base"],
  ["Consumo parcial", "Contrato iniciado antes do início da base: o consumido considera só os pagamentos desde então"],
  ["Esteira expressa", "Contrato negociado pelo CSC"],
  ["KYS", "Situação do fornecedor no processo de conhecimento (aprovado, negado), na posição mais recente"],
  ["Risco financeiro", "Classificação financeira do fornecedor (baixo, médio, alto), na posição mais recente"],
  ["Sem classificação", "Nível de subcategoria que não existe para aquele pagamento"]
];
function vGlossario() {
  const M = META.metas;
  return secao("Glossário", "Definições usadas no painel, para que cada número tenha um só significado") +
    `<div class="grade">` +
    cartao({ titulo: "Termos", corpo: `<div class="glossario">${tabela([{ t: "Termo" }, { t: "Definição" }], GLOSSARIO.map(([t, d]) => `<tr><td class="forte">${esc(t)}</td><td>${esc(d)}</td></tr>`))}</div>` }) +
    cartao({ titulo: "Metas", corpo: tabela([{ t: "Indicador" }, { t: "Meta" }], [
      `<tr><td class="forte">Cobertura contratual</td><td>≥ ${pct(M.cobertura_min, 0)}</td></tr>`,
      `<tr><td class="forte">Fora da Política</td><td>≤ ${pct(M.fora_politica_max, 0)}</td></tr>`,
      `<tr><td class="forte">Fornecedores com KYS aprovado</td><td>≥ ${pct(M.kys_min, 0)}</td></tr>`,
      `<tr><td class="forte">Saldo de contrato</td><td>alerta abaixo de ${pct(M.saldo_alerta, 0)}</td></tr>`,
      `<tr><td class="forte">Risco financeiro</td><td>sem meta, só distribuição</td></tr>`]) }) +
    `</div>`;
}

const RENDER = { executivo: vExecutivo, tendencias: vTendencias, fornecedores: vFornecedores, categorias: vCategorias, pareto: vPareto, contrato: vContrato, contratos: vContratos, riscos: vRiscos, insights: vInsights, glossario: vGlossario };

/* ============================================================
   12. Render, navegação, controles e link
   ============================================================ */
function render() {
  const t = performance.now();
  fila = []; aposRender = [];
  document.getElementById("vista").innerHTML = RENDER[estado.vista]();
  limparOrfaos();
  fila.forEach(f => f());
  aposRender.forEach(f => f());
  atualizarCabecalho();
  console.info("[painel] render", estado.vista, Math.round(performance.now() - t), "ms");
}
function irPara(id) {
  estado.vista = id;
  render();
  window.scrollTo({ top: 0 });
  salvarHash();
}
function atualizarTudo() { aplicar(); render(); salvarHash(); }

function montarControles() {
  const box = document.getElementById("filtros");
  box.appendChild(dropdown({
    key: "periodo", rotulo: "Período", cls: "periodo", busca: false,
    opcoes: () => ({ itens: opcoesPeriodo().map((o, i) => ({ v: i, nome: o.nome })), ocultas: 0 }),
    valor: () => opcoesPeriodo().findIndex(o => o.id === estado.periodo),
    definir: v => { estado.periodo = opcoesPeriodo()[v === null ? 0 : v].id; atualizarTudo(); },
    rotuloBotao: () => nomePeriodo(), ativo: () => estado.periodo !== "12m"
  }));
  FILTROS.forEach((f, pos) => box.appendChild(dropdown({
    key: f.key, rotulo: f.nome, multi: true,
    opcoes: (termo, rasc) => opcoesDim(f.key, pos, termo, rasc),
    valor: () => estado.sel[f.key],
    definir: v => { estado.sel[f.key] = v; atualizarTudo(); },
    rotuloBotao: () => { const s = estado.sel[f.key]; if (!s) return "Todos"; return s.size === 1 ? rotulo(f.key, s.values().next().value) : s.size + " selecionados"; },
    titulo: () => estado.sel[f.key] ? [...estado.sel[f.key]].map(i => rotulo(f.key, i)).join(", ") : "Todos",
    ativo: () => !!estado.sel[f.key]
  })));
  const limpar = document.createElement("button");
  limpar.type = "button"; limpar.className = "limpar"; limpar.id = "limpar-filtros"; limpar.textContent = "Limpar filtros";
  limpar.addEventListener("click", () => { FILTROS.forEach(f => { estado.sel[f.key] = null; }); estado.periodo = "12m"; atualizarTudo(); });
  box.appendChild(limpar);
  document.addEventListener("mousedown", e => Object.values(ctrls).forEach(c => { if (!c.contem(e.target)) c.fechar(true); }));
  document.addEventListener("keydown", e => { if (e.key === "Escape") Object.values(ctrls).forEach(c => c.fechar(true)); });
}

function atualizarCabecalho() {
  const r = estado.uni;
  document.getElementById("resumo").innerHTML = `Spend <b>${brl(r.T)}</b> · <b>${nf0.format(ativos(r.forn))}</b> fornecedores · <b>${nf0.format(r.N)}</b> pagamentos`;
  document.getElementById("limpar-filtros").hidden = !(FILTROS.some(f => estado.sel[f.key]) || estado.periodo !== "12m");
  Object.values(ctrls).forEach(c => c.atualizar());
  document.querySelectorAll(".aba").forEach(b => b.setAttribute("aria-selected", String(b.dataset.vista === estado.vista)));
}

function salvarHash() {
  const p = new URLSearchParams();
  p.set("v", estado.vista); p.set("per", estado.periodo);
  FILTROS.forEach(f => { if (estado.sel[f.key]) p.set(f.key, [...estado.sel[f.key]].map(i => rotuloLink(f.key, i)).join("|")); });
  try { history.replaceState(null, "", "#" + p.toString()); } catch (e) {}
}
function lerHash() {
  const p = new URLSearchParams((location.hash || "").slice(1));
  if (opcoesPeriodo().some(o => o.id === p.get("per"))) estado.periodo = p.get("per");
  FILTROS.forEach(f => {
    if (!p.get(f.key)) return;
    const s = new Set(p.get(f.key).split("|").map(n => indicePorRotulo(f.key, n)).filter(i => i >= 0));
    if (s.size) estado.sel[f.key] = s;
  });
  if (VISTAS.some(v => v.id === p.get("v"))) estado.vista = p.get("v");
}

/* ============================================================
   13. Inicialização
   ============================================================ */
function iniciar() {
  estado.vista = "executivo";
  document.title = `${META.titulo} · ${META.titulo_destaque}`;
  document.getElementById("titulo").innerHTML = `${esc(META.titulo)} · <span>${esc(META.titulo_destaque)}</span>`;
  document.getElementById("subtitulo").textContent = `${META.subtitulo} · dados até ${rotMes(META.ultimo_mes)}`;
  document.getElementById("atualizacao").textContent = META.data_atualizacao ? "Base atualizada em " + dataBR(META.data_atualizacao) : "Atualização não disponível";
  document.getElementById("rodape").textContent = META.rodape || "";
  const nav = document.getElementById("abas");
  VISTAS.forEach(v => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "aba"; b.dataset.vista = v.id; b.setAttribute("role", "tab"); b.textContent = v.nome;
    b.addEventListener("click", () => irPara(v.id));
    nav.appendChild(b);
  });
  document.getElementById("copiar-link").addEventListener("click", copiarLink);
  let salvo = 1;
  try { salvo = parseFloat(localStorage.getItem("painel-escala")) || 1; } catch (e) {}
  if (ESCALAS.includes(salvo)) { estado.escala = salvo; document.documentElement.style.setProperty("--escala", salvo); }
  document.querySelectorAll("[data-fonte]").forEach(b => b.addEventListener("click", () => definirEscala(Number(b.dataset.fonte))));
  lerHash();
  montarControles();
  aplicar();
  render();
  let tmr;
  window.addEventListener("resize", () => { clearTimeout(tmr); tmr = setTimeout(redimensionar, 120); });
}

window.PAINEL = { estado, aplicar, render, irPara, atualizarTudo };
iniciar();
}
</script>
<script>
/*__INICIO_CARREGADOR__*/
(function () {
  const el = document.getElementById("spend-data");
  const url = el.dataset.url;
  if (!url) return painelApp();
  const caixa = document.createElement("div");
  caixa.className = "carregando";
  caixa.setAttribute("role", "status");
  caixa.textContent = "Carregando dados...";
  document.body.appendChild(caixa);
  const falhar = e => {
    caixa.classList.add("erro");
    caixa.textContent = `Não foi possível carregar os dados (${url}): ${e.message}. Atualize a página e, se o erro continuar, avise o responsável pelo painel`;
  };
  fetch(url + (url.includes("?") ? "&" : "?") + "v=" + Date.now(), { cache: "no-store", credentials: "same-origin" })
    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
    .then(t => {
      el.textContent = t;
      caixa.textContent = "Montando o painel...";
      requestAnimationFrame(() => setTimeout(() => {
        try { painelApp(); caixa.remove(); } catch (e) { falhar(e); }
      }, 0));
    })
    .catch(falhar);
})();
/*__FIM_CARREGADOR__*/
</script>
