function cap1() {
  const r = estado.his, v = VISTAS[1], cu = contratoUnico();
  const vt = var_(r.T, r.Tp);
  const nMes = estado.F.c1 - estado.F.c0 + 1;
  const med = r.T / nMes, medP = r.Tp / nMes;
  const lente = estado.lente;
  const umaCat = ativos(r.cat) === 1;
  const compVet = umaCat ? r.sub1 : r.cat, compDim = umaCat ? "sub1" : "categoria";
  const comp = ranking(compVet, 10);
  const compNome = umaCat ? "subcategorias" : "categorias";
  const tComp = comp.length ? `${esc(rotulo(compDim, comp[0]))} responde por ${pct(compVet[comp[0]] / r.T, 0)} do gasto` : "Sem gasto no período";
  const mostraDir = (lente !== "diretoria" || estado.foco === null) && cu === null;
  const dirs = ranking(r.dir, 10);
  const top2 = dirs.slice(0, 2).reduce((s, i) => s + r.dir[i], 0);
  const tDir = dirs.length > 1 ? `${esc(DIMS.diretoria[dirs[0]])} e ${esc(DIMS.diretoria[dirs[1]])} somam ${pct(top2 / r.T, 0)} do consumo` : dirs.length ? `${esc(DIMS.diretoria[dirs[0]])} concentra todo o consumo` : "Sem consumo no período";

  fila.push(() => evolucao("g-evolucao", r));
  fila.push(() => barrasH("g-comp", comp.map(i => ({ nome: rotulo(compDim, i), valor: compVet[i], rotulo: `${brl(compVet[i])} · ${pct(compVet[i] / r.T, 0)}` }))));
  if (mostraDir) fila.push(() => barrasH("g-dir", dirs.map(i => ({ nome: DIMS.diretoria[i], valor: r.dir[i], rotulo: `${brl(r.dir[i])} · ${pct(r.dir[i] / r.T, 0)}` }))));

  return (cu !== null ? fichaContrato(cu) : "") + cabCap(v) +
    `<div class="kpis">` +
    kpi({ rotulo: "Spend no período", valor: brl(r.T), sub: esc(periodoTxt()) }) +
    kpi({ rotulo: "Variação", tom: "destaque", valor: sinal(vt), sub: esc(compTxt()) }) +
    kpi({ rotulo: "Fornecedores com pagamento", valor: nf0.format(ativos(r.forn)), sub: "no período selecionado" }) +
    kpi({ rotulo: "Pagamentos", valor: nf0.format(r.N), sub: `valor médio de ${brl(r.N ? r.T / r.N : 0)}` }) +
    `</div><div class="grade">` +
    cartao({ largo: true, id: "g-evolucao", pergunta: "Como o gasto evoluiu?", titulo: `Média mensal de ${brl(med)} no período${estado.F.prevOk && medP ? `, ${sinal(med / medP - 1, 0)} vs período anterior` : ""}`,
      desc: `<span class="legenda-mini"><i style="background:${C.atual}"></i>Período selecionado</span><span class="legenda-mini"><i style="background:${C.anterior}"></i>Período de comparação</span><span class="legenda-mini"><i style="background:${C.fora}"></i>Demais meses</span> · valores em R$ por mês` }) +
    cartao({ largo: !mostraDir, id: "g-comp", altura: "alto", pergunta: `Em quais ${compNome} está o dinheiro?`, titulo: tComp, desc: `Top 10 ${compNome} · valores em R$` }) +
    (mostraDir ? cartao({ id: "g-dir", altura: "alto", pergunta: "Quais diretorias consomem?", titulo: tDir, desc: "Top 10 diretorias · valores em R$" }) : "") +
    `</div></div>`;
}

function cap2() {
  const r = estado.his, v = VISTAS[2], F = estado.F, cu = contratoUnico();
  const lenteForn = fornecedorFoco() !== null;
  const vet = lenteForn ? r.dir : r.forn, vetP = lenteForn ? r.dirP : r.fornP, dim = lenteForn ? "diretoria" : "fornecedor";
  const ord = ranking(vet, 10);
  const top3 = ranking(vet, 3).reduce((s, i) => s + vet[i], 0);
  const p80 = paraN(vet, 0.8);
  const hal = F.prevOk && r.Tp ? ranking(vet, 10).map(i => ({ nome: DIMS[dim][i], a: vetP[i] / r.Tp, b: vet[i] / r.T })) : [];
  let tHal = "Sem período anterior para comparar";
  if (hal.length) {
    const g = hal.reduce((m, x) => (x.b - x.a > m.b - m.a ? x : m), hal[0]);
    const p = hal.reduce((m, x) => (x.b - x.a < m.b - m.a ? x : m), hal[0]);
    tHal = g.b - g.a > 0.001 ? `${esc(g.nome)} ganhou ${pp(g.b - g.a).replace("+", "")} de share` : "Share estável entre os períodos";
    if (p.b - p.a < -0.001) tHal += `; ${esc(p.nome)} perdeu ${pp(p.a - p.b).replace("+", "")}`;
  }
  const unicos = [];
  for (let s = 0; s < r.sub3.length; s++) if (r.sub3F[s] >= 0 && r.sub3[s] >= MIN_UNICO) unicos.push(s);
  unicos.sort((a, b) => r.sub3[b] - r.sub3[a]);
  const vUnicos = unicos.reduce((s, i) => s + r.sub3[i], 0);

  const rotulo = lenteForn ? "diretorias" : "fornecedores";
  const tBar = lenteForn ? (ord.length ? `${esc(DIMS.diretoria[ord[0]])} responde por ${pct(vet[ord[0]] / r.T, 0)} do que pagamos ${cu !== null ? "neste contrato" : "a " + esc(focoNome())}` : "Sem pagamentos no período")
    : (ord.length > 3 ? `Top 3 fornecedores detêm ${pct(top3 / r.T, 0)} do gasto` : ord.length ? `${ord.length} fornecedor${ord.length > 1 ? "es" : ""} concentra${ord.length > 1 ? "m" : ""} todo o gasto` : "Sem pagamentos no período");

  fila.push(() => barrasH("g-quem", ord.map(i => ({ nome: DIMS[dim][i], valor: vet[i], rotulo: `${brl(vet[i])} · ${pct(vet[i] / r.T, 0)}`, extra: [{ rotulo: "Share", valor: pct(vet[i] / r.T) }] }))));
  fila.push(() => halteres("g-share", hal));

  return cabCap(v) +
    `<div class="kpis">` +
    kpi({ rotulo: lenteForn ? "Diretorias atendidas" : "Fornecedores com pagamento", valor: nf0.format(ativos(vet)), sub: esc(periodoTxt()) }) +
    kpi({ rotulo: "Concentram 80% do gasto", tom: "destaque", valor: `${nf0.format(p80.n)} ${rotulo}`, sub: `${pct(p80.base ? p80.n / p80.base : NaN, 0)} do total de ${rotulo}` }) +
    (lenteForn ? "" : kpi({ rotulo: "Subcategorias com fornecedor único", valor: nf0.format(unicos.length), sub: `${brl(vUnicos)} em subcategorias acima de ${brl(MIN_UNICO)}` })) +
    `</div><div class="grade">` +
    cartao({ id: "g-quem", altura: "alto", pergunta: lenteForn ? "Quais diretorias pagam este fornecedor?" : "Quem são os fornecedores e qual o share?", titulo: tBar, desc: `Top 10 ${rotulo} · valores em R$ e % do gasto` }) +
    cartao({ id: "g-share", altura: "alto", pergunta: "Como o share mudou?", titulo: tHal, desc: `<span class="legenda-mini"><i class="aro"></i>${esc(F.rotP || "período anterior")}</span><span class="legenda-mini"><i class="ponto" style="background:${C.serie}"></i>${esc(F.rot)} (ganhou)</span><span class="legenda-mini"><i class="ponto" style="background:${C.fdp}"></i>(perdeu)</span> · unidade: % do gasto` }) +
    (lenteForn ? "" : cartao({ largo: true, pergunta: "Há dependência de fornecedor único?", titulo: unicos.length ? `${unicos.length} subcategoria${unicos.length > 1 ? "s dependem" : " depende"} de um único fornecedor` : "Nenhuma subcategoria relevante depende de um único fornecedor",
      desc: `Subcategoria 3 com um só fornecedor no período e gasto acima de ${brl(MIN_UNICO)}`,
      corpo: tabela([{ t: "Subcategoria" }, { t: "Fornecedor único" }, { t: "Spend", cls: "num" }], unicos.slice(0, 20).map(s => `<tr><td class="forte">${esc(rotulo("sub3", s))}</td><td>${esc(DIMS.fornecedor[r.sub3F[s]])}</td><td class="num forte">${brl(r.sub3[s])}</td></tr>`)) })) +
    `</div></div>`;
}

function cap3() {
  const r = estado.his, v = VISTAS[3], M = META.metas;
  const cob = r.base ? r.st[ST.COM] / r.base : NaN;
  const fdp = r.base ? r.st[ST.FDP] / r.base : NaN;
  const cts = r.contratos.filter(c => c.dias >= 0 && c.dias <= META.janela_vencimento_dias).sort((a, b) => b.spend_12m - a.spend_12m);
  const em90 = cts.filter(c => c.dias <= 90);
  const risco = cts.reduce((s, c) => s + c.spend_12m, 0);
  const partes = DIMS.status.map((s, i) => ({ nome: s, valor: r.st[i], cor: C.status[i], claro: i === ST.BAIXO || i === ST.PARC }));
  const lenteDirFoco = estado.lente === "diretoria" && estado.foco !== null;
  const lenteForn = fornecedorFoco() !== null;
  const areaVet = lenteDirFoco ? r.catFdp : r.dirFdp, areaDim = lenteDirFoco ? "categoria" : "diretoria";
  const areas = ranking(areaVet, 10);
  const semCtr = ranking(Float64Array.from(DIMS.fornecedor, (_, f) => r.forn[f] - r.fornSt[f * 5 + ST.COM]));
  const fdpForn = ranking(r.fornFdp);
  const top3fdp = fdpForn.slice(0, 3).reduce((s, f) => s + r.fornFdp[f], 0);

  fila.push(() => barra100("g-situacao", partes, r.base));
  if (!lenteForn) fila.push(() => barrasH("g-fdp-area", areas.map(i => ({ nome: DIMS[areaDim][i], valor: areaVet[i], rotulo: brl(areaVet[i]) })), { cor: C.fdp, rotulo: "Fora da Política" }));

  const tSit = isFinite(cob) ? `${pct(cob, 0)} com contrato - ${cob >= M.cobertura_min ? "dentro" : "abaixo"} da meta de ${pct(M.cobertura_min, 0)}` : "Sem gasto no período";
  const tArea = areas.length ? `${esc(DIMS[areaDim][areas[0]])} concentra ${pct(areaVet[areas[0]] / (r.st[ST.FDP] || 1), 0)} do Fora da Política` : "Nenhum gasto Fora da Política no período";
  const tSem = fdpForn.length ? `${brl(r.st[ST.FDP])} Fora da Política, ${pct(top3fdp / (r.st[ST.FDP] || 1), 0)} em ${Math.min(3, fdpForn.length)} fornecedor${fdpForn.length > 1 ? "es" : ""}` : "Nenhum fornecedor com gasto Fora da Política";
  const tVenc = cts.length ? `${cts.length} contrato${cts.length > 1 ? "s vencem" : " vence"} em ${META.janela_vencimento_dias} dias - ${brl(risco)} em jogo` : `Nenhum contrato vence nos próximos ${META.janela_vencimento_dias} dias`;
  const kysSelo = f => FORN.kys[f] === KYS_NEG ? `<span class="selo" data-nivel="critico">Negado</span>` : esc(DIMS.kys[FORN.kys[f]]);
  const nc = r.st[ST.NC];

  return cabCap(v) +
    `<div class="kpis">` +
    kpi(Object.assign({ rotulo: "Cobertura contratual", valor: pct(cob), sub: `${baseTxt()} · meta ≥ ${pct(M.cobertura_min, 0)}` }, meta(cob, M.cobertura_min, true))) +
    kpi(Object.assign({ rotulo: "Fora da Política", valor: pct(fdp), sub: `${brl(r.st[ST.FDP])} · meta ≤ ${pct(M.fora_politica_max, 0)}` }, meta(fdp, M.fora_politica_max, false))) +
    kpi({ rotulo: `Contratos vencendo em ${META.janela_vencimento_dias} dias`, valor: brl(risco), sub: `${cts.length} contratos · ${em90.length} em até 90 dias · spend dos últimos 12 meses` }) +
    `</div><div class="grade">` +
    cartao({ largo: lenteForn, id: "g-situacao", altura: "baixo", pergunta: "Quanto do gasto está coberto por contrato?", titulo: tSit, desc: `Situação contratual ${baseTxt()} · Baixo valor e Parcerias são permitidos sem contrato`,
      corpo: `<div class="grafico baixo" id="g-situacao"></div>${nc ? `<p class="nota-qualidade">${brl(nc)} sem classificação na base (qualidade de dado)</p>` : ""}` }) +
    (lenteForn ? "" : cartao({ id: "g-fdp-area", pergunta: lenteDirFoco ? "Em quais categorias está o Fora da Política?" : "Em quais áreas nasce o Fora da Política?", titulo: tArea, desc: "Top 10 · valores em R$" })) +
    (lenteForn ? "" : cartao({ largo: true, pergunta: "Quais fornecedores recebem sem contrato?", titulo: tSem, desc: "Ordenado pelo valor Fora da Política · Baixo valor e Parcerias são permitidos",
      corpo: tabela([{ t: "Fornecedor" }, { t: "Fora da Política", cls: "num" }, { t: "Baixo valor + Parcerias", cls: "num" }, { t: "% sem contrato", cls: "num" }, { t: "KYS", cls: "cen" }],
        fdpForn.concat(semCtr.filter(f => !r.fornFdp[f])).slice(0, 25).map(f => {
          const sc = r.forn[f] - r.fornSt[f * 5 + ST.COM];
          return `<tr><td class="forte">${esc(DIMS.fornecedor[f])}</td><td class="num forte">${r.fornFdp[f] ? brl(r.fornFdp[f]) : "-"}</td><td class="num">${brl(r.fornSt[f * 5 + ST.BAIXO] + r.fornSt[f * 5 + ST.PARC])}</td><td class="num">${pct(sc / r.forn[f], 0)}</td><td class="cen">${kysSelo(f)}</td></tr>`;
        })) })) +
    cartao({ largo: true, pergunta: "Quais contratos vencem em breve?", titulo: tVenc, desc: `Prazo contado a partir de hoje (${dataBR(HOJE.toISOString().slice(0, 10))}) · valor = spend dos últimos 12 meses no contrato`,
      corpo: tabela([{ t: "Contrato" }, { t: "Descrição" }, { t: "Fornecedor" }, { t: "Vence em", cls: "cen" }, { t: "Vencimento", cls: "num" }, { t: "Spend 12 meses", cls: "num" }],
        cts.map(c => `<tr><td class="forte">${esc(c.id)}</td><td>${esc(c.descricao)}</td><td>${esc(DIMS.fornecedor[c.fornecedor])}</td><td class="cen"><span class="selo" data-nivel="${nivelDias(c.dias)}">${c.dias} d</span></td><td class="num">${dataBR(c.data_fim)}</td><td class="num forte">${brl(c.spend_12m)}</td></tr>`)) }) +
    `</div></div>`;
}

function cap4() {
  const r = estado.his, v = VISTAS[4], M = META.metas;
  const fs_ = ranking(r.forn);
  const nForn = fs_.length;
  const aprov = fs_.filter(f => FORN.kys[f] === KYS_OK).length;
  const neg = fs_.filter(f => FORN.kys[f] === KYS_NEG);
  const pk = nForn ? aprov / nForn : NaN;
  const vNeg = neg.reduce((s, f) => s + r.forn[f], 0);
  const altos = fs_.filter(f => FORN.risco[f] === RISCO_ALTO);
  const pAlto = r.T ? r.riscoV[RISCO_ALTO] / r.T : NaN;
  const semAv = fs_.filter(f => FORN.risco[f] === 3);
  const atencao = fs_.filter(f => FORN.kys[f] === KYS_NEG || FORN.risco[f] === RISCO_ALTO);
  const vAt = atencao.reduce((s, f) => s + r.forn[f], 0);
  const snap = META.data_snapshot_fornecedores ? `posição de ${dataBR(META.data_snapshot_fornecedores)}` : "posição atual";
  const lenteForn = fornecedorFoco() !== null;

  if (lenteForn) {
    const f = fornecedorFoco(), k = FORN.kys[f], rk = FORN.risco[f];
    return cabCap(v) + `<div class="selos-grandes">` +
      `<div class="selo-grande" data-nivel="${k === KYS_OK ? "bom" : k === KYS_NEG ? "critico" : "neutro"}"><div class="rot">KYS · ${esc(snap)}</div><div class="val">${esc(DIMS.kys[k])}</div></div>` +
      `<div class="selo-grande" data-nivel="${["bom", "medio", "critico", "neutro"][rk]}"><div class="rot">Risco financeiro · ${esc(snap)}</div><div class="val">${esc(DIMS.risco[rk])}</div></div>` +
      `<div class="selo-grande" data-nivel="neutro"><div class="rot">Spend no período</div><div class="val">${brl(r.T)}</div></div>` +
      `</div></div>`;
  }
  fila.push(() => barra100("g-risco", DIMS.risco.map((s, i) => ({ nome: s, valor: r.riscoV[i], cor: C.risco[i], claro: i === 3 })), r.T));
  return cabCap(v) +
    `<div class="kpis">` +
    kpi(Object.assign({ rotulo: "Fornecedores com KYS aprovado", valor: pct(pk), sub: `${aprov} de ${nForn} fornecedores · meta ≥ ${pct(M.kys_min, 0)}` }, meta(pk, M.kys_min, true))) +
    kpi({ rotulo: "Pago a fornecedores com KYS negado", tom: vNeg ? "alerta" : "", valor: brl(vNeg), sub: `${neg.length} fornecedor${neg.length === 1 ? "" : "es"} · ${esc(snap)}` }) +
    kpi({ rotulo: "Spend em risco financeiro alto", tom: "destaque", valor: pct(pAlto), sub: `${brl(r.riscoV[RISCO_ALTO])} em ${altos.length} fornecedores` }) +
    kpi({ rotulo: "Sem avaliação de risco", valor: nf0.format(semAv.length), sub: `${brl(r.riscoV[3])} no período` }) +
    `</div><div class="grade">` +
    cartao({ largo: true, id: "g-risco", altura: "baixo", pergunta: "Como o gasto se distribui por risco financeiro?", titulo: `${pct(pAlto, 0)} do gasto está em fornecedores de risco alto`, desc: `Distribuição do spend por risco financeiro · ${esc(snap)} · sem meta definida` }) +
    cartao({ largo: true, pergunta: "Quais fornecedores exigem atenção?", titulo: atencao.length ? `${atencao.length} fornecedor${atencao.length > 1 ? "es" : ""} com KYS negado ou risco alto receberam ${brl(vAt)}` : "Nenhum fornecedor com KYS negado ou risco alto recebeu no período", desc: `Ordenado pelo spend no período · ${esc(snap)}`,
      corpo: tabela([{ t: "Fornecedor" }, { t: "KYS", cls: "cen" }, { t: "Risco financeiro", cls: "cen" }, { t: "Spend", cls: "num" }, { t: "% com contrato", cls: "num" }],
        atencao.slice(0, 30).map(f => `<tr><td class="forte">${esc(DIMS.fornecedor[f])}</td><td class="cen"><span class="selo" data-nivel="${FORN.kys[f] === KYS_NEG ? "critico" : "ok"}">${esc(DIMS.kys[FORN.kys[f]])}</span></td>` +
          `<td class="cen"><span class="selo" data-nivel="${FORN.risco[f] === RISCO_ALTO ? "critico" : "neutro"}">${esc(DIMS.risco[FORN.risco[f]])}</span></td><td class="num forte">${brl(r.forn[f])}</td><td class="num">${pct(r.fornSt[f * 5 + ST.COM] / r.forn[f], 0)}</td></tr>`)) }) +
    `</div></div>`;
}

function cap5() {
  const v = VISTAS[5], todos = sinais();
  const lista = filtroSinal === "todos" ? todos : todos.filter(s => s.tipo === filtroSinal);
  const tot = todos.reduce((s, x) => s + x.valor, 0);
  const cont = t => todos.filter(s => s.tipo === t).length;
  return cabCap(v) + cartao({ largo: true, pergunta: "Onde agir primeiro?",
    titulo: todos.length ? `${todos.length} sinais somam ${brl(tot)} - comece por: ${esc(todos[0].texto)}` : "Nenhum sinal de atenção no recorte selecionado",
    desc: "Valores podem se sobrepor entre sinais (um mesmo fornecedor pode aparecer como Fora da Política e com risco alto)",
    corpo: `<div class="chips" id="chips-sinal"><button type="button" class="chip" data-tipo="todos" aria-pressed="${filtroSinal === "todos"}">Todos (${todos.length})</button>` +
      Object.keys(TIPOS_SINAL).map(t => `<button type="button" class="chip" data-tipo="${t}" aria-pressed="${filtroSinal === t}">${TIPOS_SINAL[t].nome} (${cont(t)})</button>`).join("") + `</div>` +
      (lista.length ? `<ul class="sinais">${lista.slice(0, 30).map(s => `<li class="sinal"><span class="sinal-icone" style="background:${TIPOS_SINAL[s.tipo].cor}" title="${TIPOS_SINAL[s.tipo].nome}">${TIPOS_SINAL[s.tipo].ic}</span><div class="sinal-texto">${esc(s.texto)}<small>${esc(TIPOS_SINAL[s.tipo].nome)} · ${esc(s.det)}</small></div><div class="sinal-valor">${brl(s.valor)}</div></li>`).join("")}</ul>` : `<div class="vazio">Nenhum sinal deste tipo</div>`)
  }) + `</div>`;
}

const CAP_RENDER = { cap1, cap2, cap3, cap4, cap5 };

function navCap(id) {
  const i = VISTAS.findIndex(v => v.id === id);
  const ant = VISTAS[i - 1], prox = VISTAS[i + 1];
  return `<div class="nav-cap">${ant && ant.n ? `<button type="button" data-ir="${ant.id}">← ${ant.n}. ${esc(ant.nome)}</button>` : ""}${prox ? `<button type="button" class="prox" data-ir="${prox.id}">Próximo: ${prox.n}. ${esc(prox.nome)} →</button>` : ""}</div>`;
}

function renderHistoria() {
  const el = document.getElementById("vista-historia");
  if (estado.modo === "abas") el.innerHTML = CAP_RENDER[estado.vista]() + navCap(estado.vista);
  else el.innerHTML = ["cap1", "cap2", "cap3", "cap4", "cap5"].map(c => CAP_RENDER[c]()).join("");
  el.querySelectorAll("[data-ir]").forEach(b => b.addEventListener("click", () => irPara(b.dataset.ir, true)));
  const chips = el.querySelector("#chips-sinal");
  if (chips) chips.addEventListener("click", e => { const t = e.target.dataset.tipo; if (!t) return; filtroSinal = t; render(); });
}

/* ============================================================
   11. Render geral e navegação
   ============================================================ */
function render() {
  const t = performance.now();
  fila = [];
  const naHistoria = estado.vista !== "inicio";
  document.getElementById("vista-inicio").hidden = naHistoria;
  document.getElementById("vista-historia").hidden = !naHistoria;
  if (naHistoria) renderHistoria(); else renderInicio();
  limparOrfaos();
  fila.forEach(f => f());
  atualizarCabecalho();
  console.info("[painel] render", estado.vista, Math.round(performance.now() - t), "ms");
}

function irPara(id, rolarTopo) {
  const antes = estado.vista;
  estado.vista = id;
  const precisa = estado.modo === "abas" || antes === "inicio" || id === "inicio" || !document.getElementById("sec-" + id);
  if (precisa) render(); else atualizarAbas();
  if (estado.modo === "rolagem" && id !== "inicio") {
    const alvo = document.getElementById("sec-" + id);
    if (alvo) alvo.scrollIntoView({ behavior: precisa ? "auto" : "smooth", block: "start" });
  } else if (rolarTopo || precisa) {
    const ctx = document.getElementById("contexto");
    if (window.scrollY > ctx.offsetTop) window.scrollTo({ top: ctx.offsetTop - 60 });
  }
  salvarHash();
}

function atualizarAbas() {
  document.querySelectorAll(".aba").forEach(b => b.setAttribute("aria-selected", String(b.dataset.vista === estado.vista)));
}

let observador;
function observarRolagem() {
  if (observador) observador.disconnect();
  observador = new IntersectionObserver(ents => {
    if (estado.modo !== "rolagem" || estado.vista === "inicio") return;
    const vis = ents.filter(e => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
    if (vis.length) { estado.vista = vis[0].target.id.replace("sec-", ""); atualizarAbas(); salvarHash(); }
  }, { rootMargin: "-130px 0px -55% 0px" });
  document.querySelectorAll(".capitulo").forEach(c => observador.observe(c));
}

/* ============================================================
   12. Controles: filtros, período, lente e foco
   ============================================================ */
function montarControles() {
  const box = document.getElementById("filtros");
  box.appendChild(dropdown({
    key: "periodo", rotulo: "Período", cls: "periodo", busca: false,
    opcoes: () => ({ itens: opcoesPeriodo().map((o, i) => ({ v: i, nome: o.nome })), ocultas: 0 }),
    valor: () => opcoesPeriodo().findIndex(o => o.id === estado.periodo),
    definir: v => { estado.periodo = opcoesPeriodo()[v === null ? 0 : v].id; atualizarTudo(); },
    rotuloBotao: () => nomePeriodo(), ativo: () => estado.periodo !== "12m"
  }));
  FILTROS.forEach((f, pos) => box.appendChild(dropdown({
    key: f.key, rotulo: f.nome, multi: true,
    opcoes: (termo, rasc) => opcoesDim(f.key, pos, termo, rasc),
    valor: () => estado.sel[f.key],
    definir: v => { estado.sel[f.key] = v; atualizarTudo(); },
    travado: () => travadoPeloFoco(f.key),
    rotuloBotao: () => {
      if (travadoPeloFoco(f.key)) return "🔒 " + rotulo(f.key, estado.foco);
      const s = estado.sel[f.key];
      if (!s) return "Todos";
      return s.size === 1 ? rotulo(f.key, s.values().next().value) : s.size + " selecionados";
    },
    titulo: () => travadoPeloFoco(f.key) ? "Definido pelo foco escolhido abaixo" : (estado.sel[f.key] ? [...estado.sel[f.key]].map(i => rotulo(f.key, i)).join(", ") : "Todos"),
    ativo: () => !!estado.sel[f.key]
  })));
  const limpar = document.createElement("button");
  limpar.type = "button"; limpar.className = "limpar"; limpar.id = "limpar-filtros"; limpar.textContent = "Limpar filtros";
  limpar.addEventListener("click", () => { FILTROS.forEach(f => { estado.sel[f.key] = null; }); estado.periodo = "12m"; atualizarTudo(); });
  box.appendChild(limpar);

  const lentes = document.getElementById("lentes");
  Object.keys(LENTES).forEach(k => {
    const b = document.createElement("button");
    b.type = "button"; b.dataset.lente = k; b.textContent = LENTES[k].nome;
    b.addEventListener("click", () => { if (estado.lente === k) return; estado.lente = k; estado.foco = null; atualizarTudo(); if (estado.vista !== "inicio") irPara(estado.vista); });
    lentes.appendChild(b);
  });
  document.getElementById("foco-caixa").appendChild(dropdown({
    key: "foco", placeholder: "foco",
    opcoes: termo => {
      const r = estado.uni, L = estado.lente;
      const vet = L === "categoria" ? r.cat : L === "diretoria" ? r.dir : L === "contrato" ? r.ctr : r.forn;
      const o = opcoesDim(L, DIMS_DISP.indexOf(L), termo, null, vet);
      o.todosRot = LENTES[L].todos;
      return o;
    },
    valor: () => estado.foco,
    definir: v => { definirFoco(v); if (estado.vista === "inicio" && v !== null) irPara("cap1"); else { atualizarTudo(); } },
    rotuloBotao: () => focoNome(), ativo: () => estado.foco !== null
  }));

  document.addEventListener("mousedown", e => Object.values(ctrls).forEach(c => { if (!c.contem(e.target)) c.fechar(true); }));
  document.addEventListener("keydown", e => { if (e.key === "Escape") Object.values(ctrls).forEach(c => c.fechar(true)); });
}

function definirFoco(v) {
  estado.foco = v;
  aplicar();
}

function atualizarCabecalho() {
  const r = estado.uni;
  document.getElementById("resumo").innerHTML = `Spend <b>${brl(r.T)}</b> · <b>${nf0.format(ativos(r.forn))}</b> fornecedores · <b>${nf0.format(r.N)}</b> pagamentos`;
  document.getElementById("contexto-periodo").innerHTML = `<b>${esc(nomePeriodo())}</b> · ${esc(estado.F.rot)}<br>${esc(compTxt())}`;
  document.getElementById("migalha").innerHTML = `${esc(LENTES[estado.lente].nome)}: <b>${esc(focoNome())}</b>`;
  document.querySelectorAll("[data-lente]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lente === estado.lente)));
  document.querySelectorAll("[data-modo]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.modo === estado.modo)));
  document.getElementById("limpar-filtros").hidden = !(FILTROS.some(f => estado.sel[f.key]) || estado.periodo !== "12m");
  Object.values(ctrls).forEach(c => c.atualizar());
  atualizarAbas();
  if (estado.modo === "rolagem" && estado.vista !== "inicio") observarRolagem();
}

function atualizarTudo() {
  aplicar();
  render();
  salvarHash();
}

/* ============================================================
   13. Link da visão (hash) e fonte
   ============================================================ */
function salvarHash() {
  const p = new URLSearchParams();
  p.set("v", estado.vista); p.set("lente", estado.lente); p.set("per", estado.periodo); p.set("modo", estado.modo);
  if (estado.foco !== null) p.set("foco", rotuloLink(estado.lente, estado.foco));
  FILTROS.forEach(f => { if (estado.sel[f.key]) p.set(f.key, [...estado.sel[f.key]].map(i => rotuloLink(f.key, i)).join("|")); });
  try { history.replaceState(null, "", "#" + p.toString()); } catch (e) {}
}
function lerHash() {
  const p = new URLSearchParams((location.hash || "").slice(1));
  if (LENTES[p.get("lente")]) estado.lente = p.get("lente");
  if (opcoesPeriodo().some(o => o.id === p.get("per"))) estado.periodo = p.get("per");
  if (p.get("modo") === "rolagem") estado.modo = "rolagem";
  if (p.get("foco")) { const i = indicePorRotulo(estado.lente, p.get("foco")); if (i >= 0) estado.foco = i; }
  FILTROS.forEach(f => {
    if (!p.get(f.key)) return;
    const s = new Set(p.get(f.key).split("|").map(n => indicePorRotulo(f.key, n)).filter(i => i >= 0));
    if (s.size) estado.sel[f.key] = s;
  });
  if (VISTAS.some(v => v.id === p.get("v"))) estado.vista = p.get("v");
}
/* ============================================================
   14. Inicialização
   ============================================================ */
function iniciar() {
  document.title = `${META.titulo} · ${META.titulo_destaque}`;
  document.getElementById("titulo").innerHTML = `${esc(META.titulo)} · <span>${esc(META.titulo_destaque)}</span>`;
  document.getElementById("subtitulo").textContent = `${META.subtitulo} · dados até ${rotMes(META.ultimo_mes)}`;
  document.getElementById("atualizacao").textContent = META.data_atualizacao ? "Base atualizada em " + dataBR(META.data_atualizacao) : "Atualização não disponível";
  document.getElementById("rodape").textContent = META.rodape || "";

  const nav = document.getElementById("abas");
  VISTAS.forEach(v => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "aba"; b.dataset.vista = v.id; b.setAttribute("role", "tab");
    b.innerHTML = (v.n ? `<span class="num">${v.n}</span>` : "") + esc(v.nome);
    b.addEventListener("click", () => irPara(v.id, true));
    nav.appendChild(b);
  });
  document.querySelectorAll("[data-modo]").forEach(b => b.addEventListener("click", () => {
    if (estado.modo === b.dataset.modo) return;
    estado.modo = b.dataset.modo; render(); if (estado.vista !== "inicio") irPara(estado.vista); salvarHash();
  }));
  document.getElementById("migalha").addEventListener("click", () => { const c = document.getElementById("contexto"); window.scrollTo({ top: c.offsetTop - 70, behavior: "smooth" }); });
  document.getElementById("copiar-link").addEventListener("click", copiarLink);

  let salvo = 1;
  try { salvo = parseFloat(localStorage.getItem("painel-escala")) || 1; } catch (e) {}
  if (ESCALAS.includes(salvo)) { estado.escala = salvo; document.documentElement.style.setProperty("--escala", salvo); }
  document.querySelectorAll("[data-fonte]").forEach(b => b.addEventListener("click", () => definirEscala(Number(b.dataset.fonte))));

  lerHash();
  montarControles();
  aplicar();
  render();
  if (estado.modo === "rolagem" && estado.vista !== "inicio") irPara(estado.vista);
  let tmr;
  window.addEventListener("resize", () => { clearTimeout(tmr); tmr = setTimeout(redimensionar, 120); });
}

window.PAINEL = { estado, aplicar, render, irPara, atualizarTudo, definirFoco };
iniciar();
}
</script>
<script>
/*__INICIO_CARREGADOR__*/
(function () {
  const el = document.getElementById("spend-data");
  const url = el.dataset.url;
  if (!url) return painelApp();
  const caixa = document.createElement("div");
  caixa.className = "carregando";
  caixa.setAttribute("role", "status");
  caixa.textContent = "Carregando dados...";
  document.body.appendChild(caixa);
  const falhar = e => {
    caixa.classList.add("erro");
    caixa.textContent = `Não foi possível carregar os dados (${url}): ${e.message}. Atualize a página e, se o erro continuar, avise o responsável pelo painel`;
  };
  fetch(url + (url.includes("?") ? "&" : "?") + "v=" + Date.now(), { cache: "no-store", credentials: "same-origin" })
    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
    .then(t => {
      el.textContent = t;
      caixa.textContent = "Montando o painel...";
      requestAnimationFrame(() => setTimeout(() => {
        try { painelApp(); caixa.remove(); } catch (e) { falhar(e); }
      }, 0));
    })
    .catch(falhar);
})();
/*__FIM_CARREGADOR__*/
</script>
